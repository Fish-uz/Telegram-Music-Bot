<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>H2O Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0a0c10] text-slate-300 grid grid-cols-[240px,1fr] h-screen font-sans">
    
    <aside class="bg-[#0f111a] border-r border-slate-800 p-6">
        <h1 class="text-white font-bold text-lg mb-8 tracking-wider">H2O ADMIN</h1>
        <nav class="space-y-4 text-sm">
            <button onclick="render('dashboard')" class="block w-full text-left hover:text-sky-400">Dashboard</button>
            <button onclick="render('users')" class="block w-full text-left hover:text-sky-400">Usuarios</button>
            <button onclick="render('songs')" class="block w-full text-left hover:text-sky-400">Canciones en Nube</button>
        </nav>
    </aside>

    <main id="app" class="p-8 overflow-y-auto">
        </main>

    <script>
        const app = document.getElementById('app');

        async function render(view, id = null) {
            app.innerHTML = '<p class="text-slate-500">Cargando...</p>';

            if (view === 'dashboard') {
                const res = await fetch('/api/stats');
                const data = await res.json();
                app.innerHTML = `
                    <div class="grid grid-cols-4 gap-6 mb-8">
                        ${createCard('Usuarios', data.summary.total_users, 'Registrados')}
                        ${createCard('Descargas', data.summary.total_downloads, 'Histórico')}
                        ${createCard('Baneados', data.summary.banned_users, 'Restringidos')}
                    </div>
                    <div class="bg-[#0f111a] p-6 rounded-lg border border-slate-800"><canvas id="chart"></canvas></div>
                `;
                initChart();
            } 
            else if (view === 'users') {
                const res = await fetch('/api/users');
                const users = await res.json();
                app.innerHTML = `
                    <h2 class="text-xl font-bold mb-6">Listado de Usuarios</h2>
                    <table class="w-full text-left border-collapse bg-[#0f111a] rounded-lg">
                        <thead class="text-xs text-slate-500 uppercase bg-[#161925]">
                            <tr><th class="p-4">ID</th><th class="p-4">Nick</th><th class="p-4">Total</th><th class="p-4">Estado</th></tr>
                        </thead>
                        <tbody>
                            ${users.map(u => `
                                <tr class="border-b border-slate-800 hover:bg-slate-900 cursor-pointer" onclick="render('user_detail', ${u[0]})">
                                    <td class="p-4">${u[0]}</td><td class="p-4">${u[1]}</td><td class="p-4">${u[2]}</td>
                                    <td class="p-4">${u[4] ? '<span class="text-red-500">Baneado</span>' : '<span class="text-green-500">Activo</span>'}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>`;
            }
            else if (view === 'user_detail') {
                const res = await fetch(`/api/user/${id}`);
                const data = await res.json();
                app.innerHTML = `
                    <button onclick="render('users')" class="text-sky-500 mb-4">← Volver al listado</button>
                    <h2 class="text-2xl font-bold mb-4">${data.info[1]} (ID: ${data.info[0]})</h2>
                    <div class="bg-[#0f111a] p-6 rounded-lg">
                        <p>Total descargas: ${data.info[2]}</p>
                        <p>Última actividad: ${data.info[3] || 'N/A'}</p>
                    </div>
                    <h3 class="mt-6 font-bold">Historial de Canciones:</h3>
                    <ul class="mt-2 space-y-2">${data.songs.map(s => `<li>${s[0]} - <span class="text-slate-500">${s[1]}</span></li>`).join('')}</ul>
                `;
            }
        }

        function createCard(title, val, sub) {
            return `
                <div class="bg-[#0f111a] p-5 rounded-lg border border-slate-800">
                    <p class="text-[10px] uppercase text-slate-500 font-bold tracking-widest">${title}</p>
                    <h3 class="text-2xl font-bold text-white mt-1">${val}</h3>
                    <p class="text-[10px] text-sky-500 mt-2">${sub}</p>
                </div>
            `;
        }

        function initChart() {
            new Chart(document.getElementById('chart'), {
                type: 'line',
                data: { labels: ['Lun', 'Mar', 'Mié', 'Jue'], datasets: [{ data: [12, 19, 3, 5], borderColor: '#0ea5e9' }] },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        render('dashboard');
    </script>
</body>
</html>
