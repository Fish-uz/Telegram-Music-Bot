<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AllMusic · Administración</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">A</span><div><strong>AllMusic</strong><small>CONTROL CENTER</small></div></div>
    <nav id="nav">
      <button data-view="overview" class="active">Resumen</button>
      <button data-view="users">Usuarios</button>
      <button data-view="library">Biblioteca</button>
      <button data-view="activity">Actividad</button>
      <button data-view="system">Sistema</button>
    </nav>
    <div class="sidebar-footer"><span id="status-dot" class="dot"></span><span id="bot-status">Comprobando bot…</span></div>
  </aside>
  <main>
    <header><div><p class="eyebrow">ALLMUSIC / <span id="section-name">RESUMEN</span></p><h1 id="page-title">Panel de control</h1></div><button id="refresh" class="button">Actualizar</button></header>
    <section id="content" aria-live="polite"><div class="loading">Cargando datos…</div></section>
  </main>
  <dialog id="auth-dialog"><form method="dialog"><h2>Acceso administrativo</h2><p>Introduce DASHBOARD_TOKEN. Se guardará únicamente en este navegador.</p><input id="token-input" type="password" autocomplete="current-password" placeholder="Token"><div><button value="cancel" class="button ghost">Cancelar</button><button id="save-token" value="default" class="button">Continuar</button></div></form></dialog>
  <dialog id="detail-dialog"><div id="detail-content"></div><form method="dialog"><button class="button">Cerrar</button></form></dialog>
  <script src="/assets/app.js" defer></script>
</body>
</html>
